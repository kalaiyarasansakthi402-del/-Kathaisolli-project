services:
  - type: web
    name: kathaisolli-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @kathaisolli/api build
    preDeployCommand: corepack pnpm db:deploy
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://web-a9wl0ahec-kalai21.vercel.app,https://admin-eight-theta-72.vercel.app,http://localhost:3000,http://localhost:5173
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
